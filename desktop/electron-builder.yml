appId: com.ohmytoken.desktop
productName: ohmytoken
copyright: Copyright © 2026
directories:
  output: release/${version}
  buildResources: build
files:
  - '!.local/**'
  - '!native/**'
  - '!resources/network-monitor/**'
  - '!resources/window-material/**'
  - '!scripts/build-window-material.mjs'
  - '!scripts/window-material-before-pack.cjs'
  - '!scripts/build-network-monitor*.mjs'
  - '!scripts/network-monitor-*.cjs'
  - '!scripts/third-party-notices.mjs'
  - '!scripts/verify-packaged-notices.mjs'
  - '!scripts/licenses-*.cjs'
  - '!scripts/windows-uninstall-files.cjs'
  - '!installer/**'
  - '!build/windows-uninstall-files.nsh'
  - '!third-party-licenses/**'
  - '!electron-builder.network-monitor.yml'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!tests/**'
  - '!out-test/**'
  - '!devlocal/**'
  - '!tsconfig.test-node.json'
  # 必须排除 release/，否则会把之前的打包产物递归塞进 asar，导致越打越大
  - '!release/**'
  - '!updates/**'
  - '!.omo/**'
  - '!.opencode/**'
  - '!.playwright-mcp/**'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
beforePack: scripts/licenses-before-pack.cjs
afterPack: scripts/licenses-after-pack.cjs
extraResources:
  - from: ../LICENSE
    to: LICENSE
  - from: ../LICENSE_SCOPE.md
    to: LICENSE_SCOPE.md
  - from: ../COMMERCIAL_LICENSE.md
    to: COMMERCIAL_LICENSE.md
  - from: ../LICENSE-MIT-LEGACY
    to: LICENSE-MIT-LEGACY
  - from: third-party-licenses
    to: licenses
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/runtime/LICENSES.chromium.html
  - from: src/renderer/public/brand
    to: brand
win:
  icon: src/renderer/public/brand/app-icon.ico
  executableName: ohmytoken
  signAndEditExecutable: true
  extraResources:
    - from: resources/window-material/win32-${arch}
      to: window-material/win32-${arch}
      filter: ['window_material.node']
    - from: resources/network-monitor/win32-x64
      to: network-monitor/win32-x64
      filter: ['ohmytoken-network-monitor.exe']
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  installerLanguages:
    - en_US
    - zh_CN
  displayLanguageSelector: true
  include: installer/installer.nsh
  installerIcon: src/renderer/public/brand/app-icon.ico
  uninstallerIcon: src/renderer/public/brand/app-icon.ico
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ohmytoken
  uninstallDisplayName: ohmytoken
  # 与 com 后端 ReleaseArtifactContract 保持一致；version 与应用内嵌版本同源。
  artifactName: ${name}-${version}-windows-${arch}-setup.${ext}
mac:
  extraResources:
    - from: resources/window-material/darwin-${arch}
      to: window-material/darwin-${arch}
      filter: ['window_material.node']
  # macOS 使用已在 Apple Developer 注册的独立 Bundle ID；Windows 继续沿用顶层 appId。
  appId: net.ohmytoken.desktop
  icon: src/renderer/public/brand/app-icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    # electron-updater 的 MacUpdater 只接受 ZIP；DMG 仅用于官网手动安装。
    - target: zip
      arch: [x64, arm64]
  notarize: true
  artifactName: ${name}-${version}-macos-${arch}.${ext}
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
npmRebuild: true
publish:
  provider: generic
  # 运行时会被 com /desktop/bootstrap 下发值覆盖；使用保留域名避免误连真实服务。
  url: https://updater.invalid/
  channel: latest
