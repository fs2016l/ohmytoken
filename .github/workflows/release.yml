name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate release version
        run: npm run release:validate

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            artifact: windows-x64
            builder_args: "--win nsis --x64"

          - label: macOS Intel x64
            os: macos-15-intel
            artifact: macos-x64
            builder_args: "--mac dmg zip --x64"

          - label: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            builder_args: "--mac dmg zip --arm64"

    defaults:
      run:
        working-directory: desktop

    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package installer
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/**/ohmytoken-*-windows-x64-setup.exe
            desktop/release/**/ohmytoken-*-macos-x64.dmg
            desktop/release/**/ohmytoken-*-macos-x64.zip
            desktop/release/**/ohmytoken-*-macos-arm64.dmg
            desktop/release/**/ohmytoken-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' RELEASE_ASSETS < <(
            find release-assets -type f \
              \( -name 'ohmytoken-*-windows-x64-setup.exe' \
              -o -name 'ohmytoken-*-macos-x64.dmg' \
              -o -name 'ohmytoken-*-macos-x64.zip' \
              -o -name 'ohmytoken-*-macos-arm64.dmg' \
              -o -name 'ohmytoken-*-macos-arm64.zip' \) \
              -print0
          )

          if [ "${#RELEASE_ASSETS[@]}" -ne 5 ]; then
            echo "::error::Expected 5 release assets, found ${#RELEASE_ASSETS[@]}"
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${RELEASE_ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "ohmytoken ${GITHUB_REF_NAME}"
          fi
