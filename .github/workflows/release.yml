name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate release version
        run: npm run release:validate

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            artifact: windows-x64
            builder_args: "--win nsis --x64"

          - label: macOS Intel x64
            os: macos-15-intel
            artifact: macos-x64
            builder_args: "--mac dmg zip --x64"

          - label: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            builder_args: "--mac dmg zip --arm64"

    defaults:
      run:
        working-directory: desktop

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Package, sign, and notarize macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          : "${CSC_LINK:?MAC_CSC_LINK secret is required}"
          : "${CSC_KEY_PASSWORD:?MAC_CSC_KEY_PASSWORD secret is required}"
          : "${APPLE_API_KEY_P8_BASE64:?APPLE_API_KEY_P8_BASE64 secret is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"

          api_key_path="${RUNNER_TEMP}/ohmytoken-notarization-key.p8"
          cleanup() {
            rm -f "$api_key_path"
          }
          trap cleanup EXIT

          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$api_key_path"

          APPLE_API_KEY="$api_key_path" \
            CSC_IDENTITY_AUTO_DISCOVERY=true \
            npx electron-builder ${{ matrix.builder_args }} --publish never \
              -c.mac.forceCodeSigning=true

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find release -type d -name 'ohmytoken.app' -print -quit)"
          test -n "$app_path"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$app_path/Contents/Info.plist")"
          test "$bundle_id" = "net.ohmytoken.desktop"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q '^TeamIdentifier='
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/**/ohmytoken-*-windows-x64-setup.exe
            desktop/release/**/ohmytoken-*-macos-x64.dmg
            desktop/release/**/ohmytoken-*-macos-x64.zip
            desktop/release/**/ohmytoken-*-macos-arm64.dmg
            desktop/release/**/ohmytoken-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' RELEASE_ASSETS < <(
            find release-assets -type f \
              \( -name 'ohmytoken-*-windows-x64-setup.exe' \
              -o -name 'ohmytoken-*-macos-x64.dmg' \
              -o -name 'ohmytoken-*-macos-x64.zip' \
              -o -name 'ohmytoken-*-macos-arm64.dmg' \
              -o -name 'ohmytoken-*-macos-arm64.zip' \) \
              -print0
          )

          if [ "${#RELEASE_ASSETS[@]}" -ne 5 ]; then
            echo "::error::Expected 5 release assets, found ${#RELEASE_ASSETS[@]}"
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${RELEASE_ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "ohmytoken ${GITHUB_REF_NAME}"
          fi
