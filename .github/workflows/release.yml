name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate release version
        run: npm run release:validate

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

  build-windows:
    name: Build and sign Windows x64
    needs: validate
    if: >-
      github.repository == 'fs2016l/ohmytoken' &&
      github.actor == 'fs2016l' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: [self-hosted, Windows, X64, ohmytoken-signing]
    environment:
      name: windows-signing
    timeout-minutes: 45

    defaults:
      run:
        working-directory: desktop

    env:
      CI: true
      WINDOWS_CERT_SHA1: B466B505CD7DC9691E8DE86BDAC5D74DC71DAE26

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check Certum signing certificate
        shell: pwsh
        run: |
          $certificate = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert |
            Where-Object Thumbprint -eq $env:WINDOWS_CERT_SHA1

          if ($null -eq $certificate) {
            throw "Certum signing certificate $env:WINDOWS_CERT_SHA1 is unavailable. Connect SimplySign Desktop before running the release."
          }
          if (-not $certificate.HasPrivateKey) {
            throw "Certum signing certificate is present, but its SimplySign private key is unavailable."
          }
          if ($certificate.NotAfter -le (Get-Date)) {
            throw "Certum signing certificate expired on $($certificate.NotAfter.ToString('u'))."
          }

          Write-Output "Certum signing certificate is available until $($certificate.NotAfter.ToString('u'))."

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package and sign Windows installer
        run: npx electron-builder --config electron-builder.windows-signing.yml --win nsis --x64 --publish never

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if ($null -eq $signTool) {
            throw 'The x64 Windows SDK signtool.exe was not found.'
          }

          $application = Get-ChildItem release -Filter ohmytoken.exe -Recurse |
            Where-Object FullName -Match '\\win-unpacked\\ohmytoken\.exe$'
          $installer = Get-ChildItem release -Filter 'ohmytoken-*-windows-x64-setup.exe' -Recurse
          $signedFiles = @($application) + @($installer)

          if (@($application).Count -ne 1) {
            throw "Expected one packaged ohmytoken.exe, found $(@($application).Count)."
          }
          if (@($installer).Count -ne 1) {
            throw "Expected one Windows installer, found $(@($installer).Count)."
          }

          foreach ($file in $signedFiles) {
            & $signTool.FullName verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for $($file.FullName)."
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode status for $($file.FullName) is $($signature.Status)."
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERT_SHA1) {
              throw "Unexpected signing certificate on $($file.FullName)."
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "The signature on $($file.FullName) has no trusted timestamp."
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: desktop/release/**/ohmytoken-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-macos:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel x64
            os: macos-15-intel
            artifact: macos-x64
            builder_args: "--mac dmg zip --x64"

          - label: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            builder_args: "--mac dmg zip --arm64"

    defaults:
      run:
        working-directory: desktop

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package, sign, and notarize macOS installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          : "${CSC_LINK:?MAC_CSC_LINK secret is required}"
          : "${CSC_KEY_PASSWORD:?MAC_CSC_KEY_PASSWORD secret is required}"
          : "${APPLE_API_KEY_P8_BASE64:?APPLE_API_KEY_P8_BASE64 secret is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"

          api_key_path="${RUNNER_TEMP}/ohmytoken-notarization-key.p8"
          cleanup() {
            rm -f "$api_key_path"
          }
          trap cleanup EXIT

          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$api_key_path"

          APPLE_API_KEY="$api_key_path" \
            CSC_IDENTITY_AUTO_DISCOVERY=true \
            npx electron-builder ${{ matrix.builder_args }} --publish never \
              -c.mac.forceCodeSigning=true

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find release -type d -name 'ohmytoken.app' -print -quit)"
          test -n "$app_path"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$app_path/Contents/Info.plist")"
          test "$bundle_id" = "net.ohmytoken.desktop"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q '^TeamIdentifier='
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/**/ohmytoken-*-macos-x64.dmg
            desktop/release/**/ohmytoken-*-macos-x64.zip
            desktop/release/**/ohmytoken-*-macos-arm64.dmg
            desktop/release/**/ohmytoken-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' RELEASE_ASSETS < <(
            find release-assets -type f \
              \( -name 'ohmytoken-*-windows-x64-setup.exe' \
              -o -name 'ohmytoken-*-macos-x64.dmg' \
              -o -name 'ohmytoken-*-macos-x64.zip' \
              -o -name 'ohmytoken-*-macos-arm64.dmg' \
              -o -name 'ohmytoken-*-macos-arm64.zip' \) \
              -print0
          )

          if [ "${#RELEASE_ASSETS[@]}" -ne 5 ]; then
            echo "::error::Expected 5 release assets, found ${#RELEASE_ASSETS[@]}"
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${RELEASE_ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "ohmytoken ${GITHUB_REF_NAME}"
          fi
